name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test
    # macos-26 for the macOS 26 SDK: LocalRefiner sits behind
    # `#if canImport(FoundationModels)`, which is false on older SDKs. Building
    # on an older image silently drops `--refine local`.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: build
        run: swift build --arch arm64

      - name: test
        run: swift test --arch arm64

      - name: build release
        run: swift build -c release --arch arm64

      - name: verify FoundationModels is linked
        run: ./scripts/verify-binary.sh .build/arm64-apple-macosx/release/parrot

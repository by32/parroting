name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build arm64 macOS binary
    # macos-26 for the macOS 26 SDK — see scripts/verify-binary.sh.
    runs-on: macos-26
    timeout-minutes: 60

    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.enabled }}

    steps:
      - uses: actions/checkout@v4

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: build
        run: swift build -c release --arch arm64

      - name: verify FoundationModels is linked
        run: ./scripts/verify-binary.sh .build/arm64-apple-macosx/release/parrot

      - name: stage
        run: |
          BIN=.build/arm64-apple-macosx/release/parrot
          file "$BIN"
          mkdir -p dist
          cp "$BIN" dist/parrot
          strip -x dist/parrot

      # A tag that disagrees with Version.current would ship a binary that
      # misreports itself and a Homebrew formula pinned to the wrong version.
      - name: resolve version
        id: version
        run: |
          BUILT=$(./dist/parrot --version)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$BUILT" != "$TAG" ]; then
              echo "::error::tag $GITHUB_REF_NAME implies version $TAG but the binary reports $BUILT — bump Version.current"
              exit 1
            fi
          fi
          echo "version=$BUILT" >> "$GITHUB_OUTPUT"
          echo "resolved version $BUILT"

      - name: package CLI tarball
        run: |
          cd dist
          tar -czf parrot-macos-arm64.tar.gz parrot
          shasum -a 256 parrot-macos-arm64.tar.gz > parrot-macos-arm64.tar.gz.sha256
          cat parrot-macos-arm64.tar.gz.sha256

      - name: bundle Parrot.app
        run: ./scripts/bundle-app.sh dist/parrot "${{ steps.version.outputs.version }}" dist

      # Signing is optional so the unsigned CLI still ships when no certificate
      # is configured. Secrets are unreadable in step-level `if:`, so the
      # decision has to be turned into an output first.
      - name: detect signing configuration
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -n "$CERT_P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "signing is configured"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_CERT_P12 is not set — publishing the unsigned CLI only. The .app/DMG and the Accessibility-survives-upgrade behaviour need a Developer ID certificate."
          fi

      - name: import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/cert.p12"
          (umask 077; printf '%s' "$CERT_P12" | base64 --decode > "$CERT")
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"

          # Without this, codesign blocks on a GUI prompt for keychain access.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Prepend to the search list rather than replacing it, so the system
          # roots needed to validate the cert chain stay reachable.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::the imported certificate is not a 'Developer ID Application' certificate. Apple Distribution and Apple Development certs cannot sign for direct distribution."
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "will sign as: $IDENTITY"

      - name: sign, notarize, and build DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          ./scripts/sign-notarize.sh dist/Parrot.app "${{ steps.version.outputs.version }}" dist
          cd dist
          DMG="Parrot-${{ steps.version.outputs.version }}-arm64.dmg"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          cat "$DMG.sha256"

      - name: clean up keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$KEYCHAIN" || true

      - name: list artifacts
        run: ls -lh dist

      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/parrot-macos-arm64.tar.gz
            dist/parrot-macos-arm64.tar.gz.sha256
            dist/Parrot-*-arm64.dmg
            dist/Parrot-*-arm64.dmg.sha256
          generate_release_notes: true
          # The DMG is absent on unsigned builds, so an unmatched glob is not
          # an error here. The tarball's presence is guaranteed by the steps above.
          fail_on_unmatched_files: false

  tap:
    name: bump homebrew tap
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pushing to another repository needs a PAT; the job's GITHUB_TOKEN is
      # scoped to this one.
      - name: detect tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_TOKEN is not set — skipping the Homebrew tap bump."
          fi

      - name: check out tap
        if: steps.token.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: by32/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # Hash what was actually published rather than trusting a value handed
      # over from the build job, so a mangled upload fails here instead of in
      # somebody's `brew install`.
      - name: bump formula and cask
        if: steps.token.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd tap

          fetch_sha() {
            local name="$1"
            curl -fsSL --retry 3 -o "/tmp/$name" "$BASE/$name"
            sha256sum "/tmp/$name" | cut -d' ' -f1
          }

          TARBALL="parrot-macos-arm64.tar.gz"
          TARBALL_SHA=$(fetch_sha "$TARBALL")
          echo "$TARBALL -> $TARBALL_SHA"

          sed -i -E \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  url \".*\"|  url \"$BASE/$TARBALL\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$TARBALL_SHA\"|" \
            Formula/parrot.rb

          if [ "$SIGNED" = "true" ]; then
            DMG="Parrot-${VERSION}-arm64.dmg"
            DMG_SHA=$(fetch_sha "$DMG")
            echo "$DMG -> $DMG_SHA"
            sed -i -E \
              -e "s|^  version \".*\"|  version \"$VERSION\"|" \
              -e "s|^  sha256 \".*\"|  sha256 \"$DMG_SHA\"|" \
              Casks/parrot.rb
          else
            echo "::warning::unsigned build — leaving Casks/parrot.rb at its previous version."
          fi

          git diff --stat

      - name: commit and push
        if: steps.token.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd tap
          if git diff --quiet; then
            echo "tap already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "parrot $VERSION"
          git push
